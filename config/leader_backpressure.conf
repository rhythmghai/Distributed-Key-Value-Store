# Leader config for the replication back-pressure integration test.
# Deliberately tiny replication_queue_max_size + replication_send_buffer_size
# so a stuck follower triggers back-pressure quickly instead of requiring an
# unreasonable amount of test traffic to fill the OS's default buffers.
node_id=leader-1
role=LEADER
listen_port=9000
wal_path=data/leader.wal
follower=follower-1:127.0.0.1:9001
heartbeat_interval_ms=300
replication_queue_max_size=5
replication_send_buffer_size=256
